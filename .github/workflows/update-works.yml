name: Update works

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'new-work:')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_CONTENT }}

      - name: Parse issue body and update works.json
        run: |
          python3 - <<'PY'
          import json, os, re

          body = os.environ["ISSUE_BODY"]

          def extract(key):
              m = re.search(rf"^{key}\s*[:：]\s*(.*?)\s*$", body, re.MULTILINE | re.DOTALL)
              return (m.group(1).strip() if m else "")

          title = extract("title")
          subtitle = extract("subtitle")
          theme = extract("theme")
          genre = extract("genre")
          note = extract("note")
          images_raw = extract("images")
          original_text = extract("original_text")

          core_images = [i.strip() for i in images_raw.split(",") if i.strip()] if images_raw else []

          if not title or not theme or not genre:
              print("缺少必填字段：title / theme / genre")
              exit(1)

          path = "api/works.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          new_item = {
              "title": title,
              "subtitle": subtitle,
              "theme": theme,
              "core_images": core_images,
              "genre": genre,
              "original_text": original_text,
              "revised_text": original_text,
              "note": note,
          }

          if isinstance(data, dict):
              works = data.get("works_list") or data.get("works")
              if isinstance(works, list):
                  works.append(new_item)
              else:
                  data["works_list"] = [new_item]
          elif isinstance(data, list):
              data.append(new_item)
          else:
              print("works.json 结构未知")
              exit(1)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/works.json
          git commit -m "chore: add work ${{ github.event.issue.title }}" || exit 0
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ 已写入 works.json"
            })
